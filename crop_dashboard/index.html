<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Crop Yield Prediction Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .prediction-result {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .chart-container {
            position: relative;
            height: 40vh;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <h1 class="my-4 text-center">🌾 Cloud Crop Yield Prediction Dashboard</h1>

    <div class="row">
        <div class="col-lg-4 mb-4">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Live Crop Yield Prediction Model</h5>
                </div>
                <div class="card-body">
                    <form id="prediction-form">
                        <div class="mb-3">
                            <label for="input-year" class="form-label">Year (e.g., 2026)</label>
                            <input type="number" class="form-control" id="input-year" value="2026" required>
                        </div>
                        <div class="mb-3">
                            <label for="input-rainfall" class="form-label">Rainfall (mm/year)</label>
                            <input type="number" step="0.01" class="form-control" id="input-rainfall" value="800.0" required>
                        </div>
                        <div class="mb-3">
                            <label for="input-pesticides" class="form-label">Pesticides (tonnes)</label>
                            <input type="number" step="0.01" class="form-control" id="input-pesticides" value="50000.0" required>
                        </div>
                        <div class="mb-3">
                            <label for="input-temp" class="form-label">Avg Temp (°C)</label>
                            <input type="number" step="0.01" class="form-control" id="input-temp" value="20.0" required>
                        </div>
                        <div class="mb-3">
                            <label for="select-country" class="form-label">Country</label>
                            <select class="form-select" id="select-country" required>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="select-crop" class="form-label">Crop Type</label>
                            <select class="form-select" id="select-crop" required>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Get Predicted Yield</button>
                    </form>

                    <div id="prediction-result" class="alert mt-3 text-center alert-secondary" role="alert">
                        Predicted Yield (hg/ha): <span id="predicted-value" class="prediction-result">--</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Data Exploration & Trend Analysis</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="filter-country" class="form-label">Filter by Country:</label>
                            <select class="form-select" id="filter-country">
                                <option value="All">All Countries</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="filter-crop" class="form-label">Filter by Crop:</label>
                            <select class="form-select" id="filter-crop">
                                <option value="All">All Crops</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="chart-type" class="form-label">Chart Type:</label>
                            <select class="form-select" id="chart-type">
                                <option value="Yield vs Year">Yield vs Year</option>
                                <option value="Yield vs Rainfall">Yield vs Rainfall</option>
                                <option value="Yield vs Pesticides">Yield vs Pesticides</option>
                                <option value="Yield vs Temperature">Yield vs Temperature</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <canvas id="comprehensive-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
